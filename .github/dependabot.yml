version: 2
updates:
  # 1. Root & Node.js Workspace Dependencies (pnpm)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'security'

  # 2. Django Identity Service (pip)
  - package-ecosystem: 'pip'
    directory: '/apps/identity-service'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'python'
      - 'security'

  # 3. Spring Boot Orders Service (Maven)
  - package-ecosystem: 'maven'
    directory: '/apps/orders-service'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'java'
      - 'security'

  # 4. GitHub Actions Workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'ci'
      - 'github-actions'
