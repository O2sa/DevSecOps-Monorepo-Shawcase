# Gitleaks Configuration for DevSecOps Monorepo
title = "DevSecOps Monorepo Gitleaks Configuration"

[allowlist]
description = "Allowed mock secrets and environment template placeholders"
paths = [
  '''^\.env\.example$''',
  '''^apps/web/\.env\.example$''',
  '''^pnpm-lock\.yaml$''',
  '''^package-lock\.json$''',
  '''^security/policies/secrets-allowlist\.json$'''
]
regexes = [
  '''django-insecure-dev-only-secret-key-not-for-production''',
  '''django-insecure-devsecops-poc-identity-service-scaffold-key-only''',
  '''django-insecure-ci-test-key-only-not-for-production''',
  '''AdminPassword123!''',
  '''DockerPassword123!''',
  '''TestPassword123!''',
  '''Password123!''',
  '''SecurePassword123!''',
  '''your-production-secret''',
  '''devsecops-secret-key-identity-service-token-signing-key-2024-poc-min-256-bits''',
  '''your-256-bit-secret-your-256-bit-secret-your-256-bit-secret''',
  '''admin@devsecops\.local''',
  '''docker@devsecops\.local'''
]
