<header class="navbar">
  <div class="navbar-container">
    <div class="navbar-left">
      <a routerLink="/" class="navbar-brand">
        <span class="brand-badge">ADMIN</span>
        <span class="brand-text">DevSecOps Control Plane</span>
      </a>

      @if (isAdmin()) {
        <nav class="nav-links">
          <a routerLink="/dashboard" routerLinkActive="active" class="nav-link"> 📊 Overview </a>
          <a routerLink="/orders" routerLinkActive="active" class="nav-link">
            📦 Orders Management
          </a>
          <a routerLink="/products" routerLinkActive="active" class="nav-link">
            🛍️ Products Catalog
          </a>
          <a routerLink="/users" routerLinkActive="active" class="nav-link"> 👥 User Directory </a>
        </nav>
      }
    </div>

    <div class="navbar-right">
      @if (isAuthenticated() && currentUser()) {
        <div class="user-profile">
          <span class="user-greeting">
            <span class="admin-badge">Admin</span>
            <strong>{{ currentUser()?.username }}</strong>
          </span>
          <button type="button" class="btn btn-outline btn-sm" (click)="logout()">Sign Out</button>
        </div>
      } @else {
        <a routerLink="/login" class="btn btn-primary btn-sm"> Admin Sign In </a>
      }
    </div>
  </div>
</header>
