server:
  port: 8002

spring:
  application:
    name: orders-service
  datasource:
    url: jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always

# JWT configuration matching Django Identity Service
orders:
  jwt:
    secret: ${DJANGO_SECRET_KEY:django-insecure-dev-only-secret-key-not-for-production}

# Notification Service integration configuration
notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8003}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
