services:
  # 1. Public Client Application (Next.js)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: devsecops-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - devsecops-network

  # 2. Admin / Operations Dashboard (Angular)
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: devsecops-dashboard
    restart: unless-stopped
    ports:
      - "4200:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health.json || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - devsecops-network

  # 3. Identity Service (Django)
  identity-service:
    build:
      context: ./apps/identity-service
      dockerfile: Dockerfile
    container_name: devsecops-identity-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8001
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-docker-compose-poc-secret-key-change-in-prod}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,identity-service,web,dashboard}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - devsecops-network

  # 4. Orders Service (Spring Boot)
  orders-service:
    build:
      context: ./apps/orders-service
      dockerfile: Dockerfile
    container_name: devsecops-orders-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - SERVER_PORT=8002
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8002/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - devsecops-network

  # 5. Notification Service (Express)
  notification-service:
    build:
      context: ./apps/notification-service
      dockerfile: Dockerfile
    container_name: devsecops-notification-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - NODE_ENV=production
      - PORT=8003
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - devsecops-network

networks:
  devsecops-network:
    driver: bridge
