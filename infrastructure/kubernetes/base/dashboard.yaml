apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-config
  namespace: devsecops
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: devsecops-monorepo
data:
  PORT: '8080'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: devsecops
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/component: admin-portal
    app.kubernetes.io/part-of: devsecops-monorepo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/part-of: devsecops-monorepo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ghcr.io/o2sa/devsecops-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: dashboard-config
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: devsecops
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: devsecops-monorepo
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: dashboard
