apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-service-config
  namespace: devsecops
  labels:
    app.kubernetes.io/name: orders-service
    app.kubernetes.io/part-of: devsecops-monorepo
data:
  SERVER_PORT: '8002'
  NOTIFICATION_SERVICE_URL: 'http://notification-service:8003'
  CORS_ALLOWED_ORIGINS: 'http://localhost:3000,http://localhost:4200,https://store.devsecops.local,https://admin.devsecops.local'
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: 'health,info'
---
apiVersion: v1
kind: Secret
metadata:
  name: orders-service-secret
  namespace: devsecops
  labels:
    app.kubernetes.io/name: orders-service
    app.kubernetes.io/part-of: devsecops-monorepo
type: Opaque
stringData:
  DJANGO_SECRET_KEY: 'devsecops-k8s-secret-key-identity-service-token-signing-key-min-256-bits'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: devsecops
  labels:
    app.kubernetes.io/name: orders-service
    app.kubernetes.io/component: order-processing
    app.kubernetes.io/part-of: devsecops-monorepo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-service
        app.kubernetes.io/part-of: devsecops-monorepo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders-service
          image: ghcr.io/o2sa/devsecops-orders-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: orders-service-config
            - secretRef:
                name: orders-service-secret
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: devsecops
  labels:
    app.kubernetes.io/name: orders-service
    app.kubernetes.io/part-of: devsecops-monorepo
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8002
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: orders-service
