rules:
  - id: python-django-hardcoded-secret-key
    patterns:
      - pattern: SECRET_KEY = "..."
      - pattern-not: SECRET_KEY = os.environ.get(...)
      - pattern-not: SECRET_KEY = os.getenv(...)
    message: 'Hardcoded Django SECRET_KEY detected in source code. Use environment variables.'
    languages: [python]
    severity: ERROR
    metadata:
      cwe: 'CWE-798: Use of Hard-coded Credentials'
      owasp: 'A07:2021 - Identification and Authentication Failures'

  - id: javascript-avoid-eval
    patterns:
      - pattern: eval(...)
    message: 'Avoid using eval() which can lead to remote code execution.'
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: 'A03:2021 - Injection'

  - id: java-avoid-weak-hashing
    patterns:
      - pattern: MessageDigest.getInstance("MD5")
    message: 'MD5 is a cryptographically broken hash algorithm. Use SHA-256 or SHA-512 instead.'
    languages: [java]
    severity: WARNING
    metadata:
      cwe: 'CWE-328: Use of Weak Hash'
      owasp: 'A02:2021 - Cryptographic Failures'

  - id: generic-cors-wildcard-with-credentials
    patterns:
      - pattern-inside: |
          {
            ...,
            origin: "*",
            credentials: true,
            ...
          }
    message: "Do not use wildcard origin '*' together with credentials: true in CORS configuration."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: 'CWE-346: Origin Validation Error'
      owasp: 'A01:2021 - Broken Access Control'
